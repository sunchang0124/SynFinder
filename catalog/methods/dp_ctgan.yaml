caveats:
  - CTGAN with DP-SGD bolted on. Utility falls off faster than for
    marginal-based DP methods, and at tight epsilon it can be worse than a
    simple DP baseline while costing far more compute.
  - Always benchmark it against PrivBayes or MST at your target epsilon before
    committing. The GAN is frequently the worse choice and rarely the obvious one.
  - Inherits CTGAN's problems with high-cardinality categoricals, amplified by
    the noise.
evaluation:
  - Report epsilon and delta alongside every utility number
  - Run the full privacy-utility curve, not one epsilon
