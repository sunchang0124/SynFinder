caveats:
  - Models visit timing as well as visit content, so inter-visit intervals stay
    plausible. Most EHR generators ignore timing entirely.
  - Two-stage training, transformer then GAN, gives two things that can fail to
    converge. Budget time for tuning.
  - No formal privacy guarantee.
evaluation:
  - Inter-visit interval distributions, not only code distributions
  - Next-visit prediction trained on synthetic, tested on real
