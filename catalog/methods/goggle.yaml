caveats:
  - Learns a relational graph between variables and generates through it, so the
    dependency structure is inspectable rather than buried in weights. That is
    the reason to choose it over a plain VAE.
  - The learned graph is a dependency graph, not a causal one. Reading
    interventions off it requires the same domain verification a Bayesian
    network needs.
  - Reported performance has been uneven in independent benchmarks.
evaluation:
  - Inspect the learned graph against domain expectation before trusting output
  - SDMetrics fidelity plus machine-learning efficiency
