id: synthea_covid19
name: Synthea COVID-19 synthetic dataset
domains: [biomedical]
data_types: [coded_event_sequences]
n_records: ~125,000 synthetic patients with COVID-19 care pathways
generated_by: synthea
purposes: [pipeline_testing, education, benchmarking]
formal_dp: false
access_conditions: Free public download
license: Apache-2.0
realism_caveats:
  - Built from a care-pathway model written early in the pandemic; the clinical
    course encoded in it reflects that moment's guidance, not current practice.
  - No real patient data, so it is safe to share and useless for epidemiology.
links:
  code: https://github.com/synthetichealth/synthea
