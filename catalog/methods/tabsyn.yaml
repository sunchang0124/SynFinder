caveats:
  - Diffusion in a learned latent space rather than on the raw columns, which
    makes it faster to sample than TabDDPM and better at mixed types.
  - Two components to train, so two things to tune before you see the reported quality.
  - No formal privacy guarantee, and the same fidelity-versus-disclosure tension
    as TabDDPM applies.
evaluation:
  - SDMetrics fidelity plus machine-learning efficiency
  - Nearest-neighbour distance ratio against the training set
