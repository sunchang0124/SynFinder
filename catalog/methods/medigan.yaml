caveats:
  - A framework, not a method. It exposes pretrained generative models for
    medical imaging behind one API, so you can generate images without training
    anything - by far the fastest route to synthetic medical images.
  - You are using someone else's model trained on someone else's cohort. Know
    which dataset each model came from before you draw any conclusion from its output.
  - Coverage is broadest for mammography and a few other modalities; check
    whether yours is there before planning around it.
evaluation:
  - Check the source dataset and training details of the specific model you use
  - Expert review of generated samples, as for any imaging model
