governance:
  acceptance_evidence: []
  known_deployments: []
caveats:
  - Conditional generation targeted at uncommon diseases, which is the case most
    EHR generators handle worst - they smooth rare conditions away entirely.
  - Generates visit sequences rather than aggregates, so temporal structure survives.
  - GAN training instability applies; expect to tune, and check that requested
    rare conditions actually appear at the rate you asked for.
evaluation:
  - Prevalence of the rare conditions you conditioned on, specifically
  - Visit-length and code-per-visit distributions against real data
