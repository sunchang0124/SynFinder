caveats:
  - Models a patient as a hierarchy of visits and codes, which is why it keeps
    visit-level structure that flat tabular methods destroy. That structure is
    the reason to choose it.
  - Vocabulary size drives everything. A large code vocabulary means a long
    training run on a real GPU, and it will not fit on a laptop.
  - No formal privacy guarantee, and autoregressive models over sparse code
    sequences can reproduce rare code combinations that identify a patient.
    Run membership inference before releasing anything.
  - Research code accompanying a paper; expect to read it rather than install it.
evaluation:
  - Compare code prevalence, codes per visit and visits per patient against real data
  - Check that clinically impossible sequences do not appear
  - Membership inference, with particular attention to rare code combinations
