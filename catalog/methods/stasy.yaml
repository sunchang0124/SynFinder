caveats:
  - Score-based diffusion with a self-paced training schedule, which is what
    makes it stable where plain diffusion on tabular data is not.
  - Categorical columns are handled by continuous relaxation, so high-cardinality
    categoricals remain awkward.
  - Sampling is slow relative to a GAN, and the published gains over TabDDPM are
    dataset-dependent rather than uniform.
evaluation:
  - SDMetrics fidelity plus machine-learning efficiency
  - Compare against TabDDPM on your own data before committing
