caveats:
  - Built for conditional imputation rather than unconditional generation - it
    fills gaps given observed values. Use it to complete sparse clinical series,
    not to invent whole patients.
  - Because it conditions on real observations, the output is a function of real
    records. It is not a privacy mechanism and must not be treated as one.
  - Validated on healthcare time series, so the clinical claim is better
    supported than most.
evaluation:
  - Imputation error on held-out masked values
  - Calibration of the predictive distribution, not only point accuracy
