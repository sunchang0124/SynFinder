caveats:
  - Text-conditioned - you write a radiology impression and get a chest X-ray
    showing it. That makes it uniquely good at generating rare findings you
    cannot collect enough of.
  - Built by fine-tuning a general image model on chest radiographs, so it
    inherits whatever that model absorbed from the open internet.
  - Findings it generates are as good as the prompt. It will happily produce an
    anatomically impossible presentation if you ask for one, without complaint.
  - Chest radiography only. Nothing about it transfers to other modalities.
evaluation:
  - Radiologist assessment of whether the requested finding is actually present
    and correctly localised
  - Downstream classifier trained on synthetic, tested on real
