governance:
  acceptance_evidence:
    - Reports a formal epsilon, so it can be written into a DPIA
  known_deployments: []
caveats:
  - Gets its guarantee from a teacher ensemble rather than from DP-SGD, which
    often buys better utility at the same epsilon than a naively noised GAN.
  - The teacher count is a real tuning burden - too few and the signal is noise,
    too many and each teacher has too little data.
  - Reported utility is sensitive to implementation details; independent
    reproductions have come out worse than the paper.
evaluation:
  - Report epsilon and delta with every utility number
  - Compare against a DP marginal-based method at the same epsilon before
    concluding a GAN was the right choice
