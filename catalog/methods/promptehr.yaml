caveats:
  - One of the few options that handles coded events and free text together,
    which is why you would choose it despite the cost.
  - Built on a pretrained language model, so it carries that model's biases and
    its training data into your synthetic cohort. What it "knows" about a
    disease may not come from your data at all.
  - Generated free text is the highest-risk output in this catalog for
    disclosure. Do not release it without manual review.
evaluation:
  - Perplexity-style checks on held-out real records
  - Manual clinical review of a sample of generated text, always
