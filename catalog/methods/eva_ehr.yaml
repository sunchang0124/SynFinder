caveats:
  - Conditional generation lets you ask for patients with a given condition,
    which is the main practical reason to reach for it over an unconditional model.
  - Like most VAEs it over-smooths; rare codes and unusual trajectories are
    under-produced relative to the real data.
  - Research code; expect to adapt it to your vocabulary yourself.
evaluation:
  - Code prevalence and visit-length distributions against real data
  - Check that the conditioning actually holds in the generated cohort
