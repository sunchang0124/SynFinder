caveats:
  - >-
    No public implementation is available - the repository referenced in the
    literature is gone. Using this means reimplementing it from the paper,
    which is a different size of project from installing a package.
  - Accelerated sampling makes it practical where plain diffusion on EHR is too
    slow to generate a useful cohort.
  - Conditioning on a label is supported, which is what you want for generating
    a specific patient subgroup.
  - Research code accompanying a paper; reproducing the published numbers is not
    straightforward.
evaluation:
  - Dimension-wise probability and prediction against real data
  - Train-on-synthetic, test-on-real for your downstream task
