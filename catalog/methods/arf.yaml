caveats:
  - Trains in seconds on a CPU and is competitive with deep generative models on
    tabular fidelity benchmarks. If you were about to spend a week tuning a GAN,
    run this first and see whether you still need to.
  - Density estimation assumes local independence within each leaf, so very
    sharp non-linear interactions can be smoothed away.
  - No formal privacy guarantee, and like all tree methods it partitions on real
    values, so check for memorised records before release.
evaluation:
  - SDMetrics fidelity plus machine-learning efficiency
  - Nearest-neighbour distance ratio against the training set
