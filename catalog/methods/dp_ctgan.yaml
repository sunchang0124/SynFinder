id: dp_ctgan
name: DP-CTGAN
family: gan
domains: [general]
data_types: [tabular_cross_sectional]
variable_types: [continuous, categorical, ordinal, count]
formal_dp: true
dp_mechanism: DP-SGD applied to the CTGAN discriminator
compute: gpu_recommended
license: MIT
purposes: [open_release, ml_augmentation, benchmarking]
preserves: [marginals, joint_correlations]
scale:
  evidence: null
expertise: high
maturity:
  maintained: true
  last_release: null
  implementation_quality: research_code
governance:
  acceptance_evidence:
    - Reports a formal epsilon
  known_deployments: []
caveats:
  - CTGAN with DP-SGD bolted on. Utility falls off faster than for
    marginal-based DP methods, and at tight epsilon it can be worse than a
    simple DP baseline while costing far more compute.
  - Always benchmark it against PrivBayes or MST at your target epsilon before
    committing. The GAN is frequently the worse choice and rarely the obvious one.
  - Inherits CTGAN's problems with high-cardinality categoricals, amplified by
    the noise.
evaluation:
  - Report epsilon and delta alongside every utility number
  - Run the full privacy-utility curve, not one epsilon
links:
  paper: https://doi.org/10.48550/arXiv.2001.09700
  code: https://github.com/vanderschaarlab/synthcity
