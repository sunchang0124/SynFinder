caveats:
  - Builds graphs node by node with a recurrent model. The standard baseline in
    graph generation papers, which is the main reason to run it.
  - Output depends on the node ordering used during training, which is an
    arbitrary choice that quietly shapes the result.
  - Superseded on quality by diffusion approaches; keep it for comparability.
evaluation:
  - Maximum mean discrepancy over degree, clustering and orbit statistics
