caveats:
  - Privatises one summary of the data and then trains a generator against it,
    so the privacy cost is paid once rather than per training step. That makes it
    far cheaper at tight epsilon than DP-SGD approaches.
  - Random features capture smooth structure. Sharp conditional dependencies and
    rare categories are largely lost.
  - Handles continuous variables more naturally than the marginal-based DP
    methods, which need discretisation - that is the main reason to reach for it.
evaluation:
  - Report epsilon and delta with every utility number
  - Compare against AIM or PrivBayes at the same epsilon
