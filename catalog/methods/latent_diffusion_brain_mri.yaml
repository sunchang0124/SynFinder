id: latent_diffusion_brain_mri
name: Latent diffusion for brain MRI
aliases: [MONAI brain LDM, Pinaya latent diffusion]
family: diffusion
domains: [biomedical]
data_types: [images]
variable_types: []
formal_dp: false
compute: gpu_required
license: Apache-2.0
purposes: [ml_augmentation, open_release, benchmarking, education]
preserves: [marginals]
scale:
  evidence: null
expertise: high
maturity:
  maintained: true
  last_release: null
  implementation_quality: research_code
governance:
  acceptance_evidence:
    - A large synthetic brain MRI dataset generated by this approach was
      released publicly, which is itself the strongest precedent available for
      sharing synthetic medical images
  known_deployments:
    - Implemented in MONAI Generative Models
caveats:
  - Conditioning on age, sex and brain volume lets you generate cohorts you
    could not recruit. That is the reason to use it and also the reason to be
    careful - the conditioning reflects the training population's confounds.
  - Anatomical plausibility is not guaranteed by any fidelity metric. Images can
    score well and still contain structures no radiologist would accept. A
    clinician must look at a sample.
  - Trained on a specific scanner and protocol distribution. Output carries that
    domain, and a model trained on it will not transfer to your scanner for free.
  - Faces are reconstructible from head MRI. Synthetic does not automatically
    mean unidentifiable; check before release.
evaluation:
  - Radiologist review of a random sample - non-negotiable, before any metric
  - FID or MS-SSIM against real images, as a secondary check only
  - Train a downstream segmentation or classification model on synthetic, test on real
links:
  paper: https://doi.org/10.1007/978-3-031-18576-2_12
  code: https://github.com/Project-MONAI/GenerativeModels
related_datasets: []
