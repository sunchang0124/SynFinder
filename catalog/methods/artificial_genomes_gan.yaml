governance:
  acceptance_evidence:
    - Published with an explicit privacy analysis rather than a fidelity-only
      argument, unusual for genomic generative models
  known_deployments: []
caveats:
  - >-
    No public implementation is available - the repository referenced in the
    literature is gone. Using this means reimplementing it from the paper,
    which is a different size of project from installing a package.
  - Learns haplotype structure from real genomes rather than assuming a
    demographic model, so it reproduces population structure the model-based
    simulators cannot.
  - Genomic data is the worst case for re-identification - a few hundred
    variants identify a person for life, and their relatives. Overfitting here
    does not leak a record, it leaks a family.
  - The authors measure nearest-neighbour adversarial accuracy for exactly this
    reason. Reproduce that check on your own output; do not take fidelity scores
    as reassurance.
  - Demonstrated on limited numbers of variants, far short of a full genome.
evaluation:
  - Nearest-neighbour adversarial accuracy and allele frequency correlation
  - Principal component overlay of real and synthetic genomes
  - Linkage disequilibrium decay curves
