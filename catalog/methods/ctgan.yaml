id: ctgan
name: CTGAN
aliases: [Conditional Tabular GAN]
family: gan
domains: [general]
data_types: [tabular_cross_sectional]
variable_types: [continuous, categorical, ordinal, count]
formal_dp: false
compute: gpu_recommended
license: MIT
purposes: [ml_augmentation, pipeline_testing, benchmarking, imbalance_correction]
preserves: [marginals, joint_correlations]
scale:
  min_rows: 23000
  max_rows: 481000
  max_cols: 784
  evidence: >-
    Xu et al. 2019, Table 4 (benchmark datasets). Largest by rows is Covertype
    at 481k train / 100k test; smallest is Adult at 23k train. Widest is
    MNIST28 at 784 columns, which is a flattened image - the widest genuinely
    tabular set is Census at 41 columns.
expertise: medium
maturity:
  maintained: true
  last_release: "2026-02"
  implementation_quality: production_ready
governance:
  acceptance_evidence: []
  known_deployments:
    - Widely used as the baseline in tabular synthetic data benchmarks
caveats:
  - High-cardinality categorical columns blow up the conditional vector; training
    becomes unstable and rare categories are dropped entirely.
  - Offers no formal privacy guarantee. Memorisation of outlier records has been
    demonstrated repeatedly, so it is not a defensible basis for open release of
    sensitive data however good the utility looks.
  - Needs on the order of thousands of rows. On small clinical cohorts it
    overfits and effectively resamples the training data.
evaluation:
  - SDMetrics column shape and column pair trend scores
  - Nearest-neighbour distance ratio against the training set, to detect
    memorised records
  - Train-on-synthetic, test-on-real for the downstream model you actually care about
links:
  paper: https://doi.org/10.48550/arXiv.1907.00503
  code: https://github.com/sdv-dev/CTGAN
  docs: https://docs.sdv.dev/sdv
related_datasets: []
output_preview:
  format: tabular_csv
  note: >-
    One row per person, same columns and types as your input. Values are new; the schema is yours.
  preview: |
    patient_id,age,sex,bmi,hba1c,smoker,diagnosis
    s0001,54,F,27.3,6.1,former,E11.9
    s0002,38,M,31.8,5.4,never,I10
    s0003,71,F,24.1,7.9,current,E11.9
