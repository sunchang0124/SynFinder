caveats:
  - Explicitly handles incomplete and irregularly sampled series, which is the
    situation clinical time series are actually in - a genuine advantage over
    TimeGAN here.
  - Validated on ICU benchmarks, so the clinical claim is better supported than
    most in this part of the catalog.
  - Research code, thin documentation.
evaluation:
  - Train-on-synthetic, test-on-real for an ICU prediction task
  - Check that the missingness and sampling-interval patterns survive
