caveats:
  - The original work on discrete EHR generation and still the standard
    reference point, but it has been superseded on every axis. Cite it; do not
    deploy it.
  - Produces aggregate code counts per patient, not visit sequences. All
    temporal structure is gone.
  - Unmaintained, with a TensorFlow 1 codebase that no longer runs without work.
evaluation:
  - Dimension-wise probability and dimension-wise prediction, as in the paper
