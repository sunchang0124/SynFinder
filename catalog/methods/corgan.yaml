caveats:
  - Uses convolutional autoencoders to capture correlation between neighbouring
    discrete features, which helps when your feature ordering is meaningful and
    does nothing when it is not.
  - Like medGAN it produces per-patient aggregates, not sequences.
  - Unmaintained research code.
