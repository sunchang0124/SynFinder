[project]
name = "synfinder"
version = "0.1.0"
description = "Find the right synthetic data generation method for your research"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Chang Sun" }]
urls = { Homepage = "https://sunchang0124.github.io/SynFinder/", Repository = "https://github.com/sunchang0124/SynFinder" }
dependencies = ["pydantic>=2.6", "pyyaml>=6.0"]

[project.optional-dependencies]
app = ["streamlit>=1.33"]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
all = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "streamlit>=1.33"]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8.0"]
uitest = ["playwright>=1.40"]

[project.scripts]
synfinder = "synfinder.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
