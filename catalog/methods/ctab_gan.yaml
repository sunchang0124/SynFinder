caveats:
  - Extends CTGAN with explicit handling of mixed-type columns, long-tailed
    distributions and skew — the failure modes that bite CTGAN hardest on real
    clinical data.
  - CTAB-GAN+ adds an optional differential privacy variant, but the base model
    carries no guarantee. Do not assume the DP claim applies unless you ran that mode.
  - Research code with limited maintenance; expect to pin versions.
evaluation:
  - SDMetrics column shape and column pair trend scores
  - Check the tails specifically, since that is what it claims to improve
