name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run the suite without any API key
        env:
          ANTHROPIC_API_KEY: ""
          ANTHROPIC_AUTH_TOKEN: ""
        run: python -m pytest -q

  app-boots-from-a-clean-checkout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exactly as the README says
        run: pip install -e ".[web,dev]"
      - name: Start the app and check it serves a usable page
        run: |
          ./run_web.sh &
          for i in $(seq 1 40); do
            curl -sf http://localhost:8501/ >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:8501/ -o page.html
          grep -q "<title>SynFinder</title>" page.html
          grep -q "design tokens" page.html   # CSS really is inlined
          curl -sf http://localhost:8501/api/taxonomy | grep -q biomedical
          curl -sf -X POST http://localhost:8501/api/recommend \
            -H 'Content-Type: application/json' \
            -d '{"domain":"biomedical","data_type":"tabular_cross_sectional","purpose":"open_release","privacy":"required"}' \
            | grep -q '"shortlist"'
          echo "app boots and answers from a clean checkout"

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Check every catalog link still resolves
        env:
          SYNFINDER_CHECK_LINKS: "1"
        run: python -m pytest tests/test_links.py -q
