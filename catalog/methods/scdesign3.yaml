governance:
  acceptance_evidence: []
  known_deployments:
    - Widely used to benchmark single-cell and spatial omics methods
caveats:
  - Fits marginal distributions per gene and ties them together with a copula,
    so gene-gene correlations and cell-cell distances survive - the things
    Splatter loses. In published benchmarks it beats scGAN, muscat and SPARSim
    on exactly those measures.
  - Handles continuous trajectories and spatial coordinates, not only discrete
    cell types, which is unusual.
  - It learns from a real dataset, so unlike Splatter the output is derived from
    real cells. Treat the privacy question as open rather than settled.
  - Fitting is slower than Splatter and scales with the number of genes you keep.
evaluation:
  - Gene-gene correlation and cell-cell distance agreement, not just marginals
  - The package's own diagnostic plots against the reference data
links:
  paper: https://doi.org/10.1038/s41587-023-01772-1
  code: https://github.com/SONGDONGYUAN1994/scDesign3
