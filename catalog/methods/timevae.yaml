caveats:
  - Trains far faster than the GAN and diffusion alternatives and runs on a CPU,
    which makes it the practical starting point for time series rather than the
    best-scoring one.
  - Interpretable variant lets you impose trend and seasonality directly, useful
    when you know the structure and want it respected.
  - Over-smooths like most VAEs, so spikes and rare excursions are under-produced -
    which matters if the clinical signal you care about is the excursion.
evaluation:
  - Discriminative and predictive scores
  - Check that peaks and rare excursions survive at a realistic rate
