id: synteg
name: SynTEG
family: gan
domains: [biomedical]
data_types: [coded_event_sequences, tabular_longitudinal]
variable_types: [categorical, count, datetime]
formal_dp: false
compute: gpu_required
license: MIT
purposes: [ml_augmentation, benchmarking, statistical_replication]
preserves: [temporal_dynamics, joint_correlations]
scale:
  evidence: null
expertise: high
maturity:
  maintained: false
  last_release: null
  implementation_quality: research_code
governance:
  acceptance_evidence: []
  known_deployments: []
caveats:
  - >-
    No public implementation is available - the repository referenced in the
    literature is gone. Using this means reimplementing it from the paper,
    which is a different size of project from installing a package.
  - Models visit timing as well as visit content, so inter-visit intervals stay
    plausible. Most EHR generators ignore timing entirely.
  - Two-stage training, transformer then GAN, gives two things that can fail to
    converge. Budget time for tuning.
  - No formal privacy guarantee.
evaluation:
  - Inter-visit interval distributions, not only code distributions
  - Next-visit prediction trained on synthetic, tested on real
links:
  paper: https://doi.org/10.1093/jamia/ocaa262
  code: null
related_datasets: []
