caveats:
  - Learns the expression distribution rather than assuming a parametric form,
    and can generate cells conditioned on a cluster.
  - Independent benchmarks have found it behind the statistical simulators on
    gene-gene correlation and cell-cell distance, despite the deep model.
    Reach for it when you specifically want a learned generator, not by default.
  - Needs a GPU and a large reference dataset, which is a steep cost for a
    method that does not currently win its benchmarks.
evaluation:
  - Gene-gene correlation and cell-cell distance against real data
  - Compare against scDesign3 on your own reference before committing
