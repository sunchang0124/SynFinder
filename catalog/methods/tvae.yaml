id: tvae
name: TVAE
aliases: [Tabular Variational Autoencoder]
family: vae
domains: [general]
data_types: [tabular_cross_sectional]
variable_types: [continuous, categorical, ordinal, count]
formal_dp: false
compute: gpu_recommended
license: MIT
language: python
last_updated: 2026
purposes: [ml_augmentation, pipeline_testing, benchmarking]
preserves: [marginals, joint_correlations]
scale:
  min_rows: 23000
  max_rows: 481000
  max_cols: 784
  evidence: >-
    Evaluated on the same benchmark as CTGAN (Xu et al. 2019, Table 4):
    Covertype 481k train is the largest, Adult 23k train the smallest,
    MNIST28 the widest at 784 flattened-image columns.
expertise: medium
maturity:
  maintained: true
  last_release: "2026-02"
  implementation_quality: production_ready
governance:
  acceptance_evidence: []
  known_deployments: []
caveats:
  - Trains more stably than CTGAN and often scores better on column-wise
    fidelity, but tends to over-smooth, so tails and rare combinations are
    under-represented.
  - No formal privacy guarantee.
  - The reconstruction objective can reproduce training records closely when the
    latent dimension is set too large.
evaluation:
  - SDMetrics column shape and column pair trend scores
  - Explicitly check the tails of clinically important continuous variables
links:
  paper: https://doi.org/10.48550/arXiv.1907.00503
  code: https://github.com/sdv-dev/CTGAN
  docs: https://docs.sdv.dev/sdv
related_datasets: []
output_preview:
  format: tabular_csv
  note: >-
    One row per person, same columns and types as your input. Values are new; the schema is yours.
  preview: |
    patient_id,age,sex,bmi,hba1c,smoker,diagnosis
    s0001,54,F,27.3,6.1,former,E11.9
    s0002,38,M,31.8,5.4,never,I10
    s0003,71,F,24.1,7.9,current,E11.9
