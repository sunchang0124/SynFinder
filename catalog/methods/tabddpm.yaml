caveats:
  - Generally beats CTGAN and TVAE on fidelity benchmarks, and handles tails
    better than either. If you were reaching for CTGAN out of habit, try this first.
  - Sampling is slow compared with a GAN; generating a large cohort takes real time.
  - Better fidelity means more of the training distribution is reproduced, which
    cuts both ways. Higher-fidelity output is a higher disclosure risk, not a lower one.
evaluation:
  - SDMetrics fidelity plus machine-learning efficiency
  - Nearest-neighbour distance ratio - this is exactly the model where it matters
