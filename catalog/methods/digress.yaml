caveats:
  - Discrete diffusion over nodes and edges, which respects the fact that graphs
    are discrete objects rather than forcing them into a continuous space.
    Currently the strongest general-purpose graph generator.
  - Benchmarked on molecules. Applying it to a patient contact or referral
    network is reasonable but unvalidated - the structural statistics that
    matter there are different ones.
  - Scales poorly to large graphs; think thousands of nodes, not millions.
evaluation:
  - Degree, clustering and orbit-count distributions against the real graphs
  - For molecules, validity, uniqueness and novelty rates
