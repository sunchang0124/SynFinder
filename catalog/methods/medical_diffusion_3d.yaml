caveats:
  - Generates full 3D volumes rather than slices, which matters - slice-wise
    generation produces volumes that are incoherent along the third axis and
    are useless for anything volumetric.
  - Memory hungry. Expect to need a large-memory GPU, and expect long sampling times.
  - Evaluated by having radiologists try to distinguish real from synthetic;
    that is the right bar, and it is the bar your own outputs should clear too.
evaluation:
  - Expert reader study, ideally blinded
  - Downstream segmentation performance when trained on synthetic volumes
