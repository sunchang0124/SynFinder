caveats:
  - Serialises each row as a sentence and fine-tunes a language model on it, so
    column names carry meaning and free-text fields come along for free.
  - The pretrained model brings outside knowledge into your synthetic data. For
    a clinical dataset that means the output can encode associations from the
    internet rather than from your cohort - sometimes helpful, always a
    confounder you did not consent to.
  - Language models memorise. Verbatim reproduction of training rows has been
    demonstrated for this class of model.
  - Slow to train and slow to sample relative to everything else here.
evaluation:
  - SDMetrics fidelity plus machine-learning efficiency
  - Exact-match search for training rows in the output, every time
