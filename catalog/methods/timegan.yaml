caveats:
  - The standard baseline in time-series synthesis papers, which is the main
    reason to run it - comparability, not quality.
  - Continuous variables only. Categorical columns need encoding, and the
    results degrade when you do.
  - Handles short sequences; quality falls away as sequence length grows.
  - Unmaintained TensorFlow 1 reference implementation.
evaluation:
  - The paper's discriminative and predictive scores
  - t-SNE or PCA overlay of real and synthetic sequences
links:
  paper: https://papers.nips.cc/paper/2019/hash/c9efe5f26cd17ba6216bbe2a7d26d490-Abstract.html
