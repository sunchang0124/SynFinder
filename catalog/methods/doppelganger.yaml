caveats:
  - Separates per-series metadata from the measurements, which is why it keeps
    long-range structure that plain RNN GANs lose.
  - Designed and validated on networking and systems traces, not clinical data.
    Nothing stops you using it on physiological signals, but nobody has
    established that it works there.
  - The authors documented a membership inference risk themselves. Treat the
    output as sensitive.
evaluation:
  - Autocorrelation over long lags
  - Distribution of the per-series metadata, separately from the measurements
links:
  paper: https://doi.org/10.1145/3419394.3423643
  code: https://github.com/fjxmlzn/DoppelGANger
related_datasets: []
