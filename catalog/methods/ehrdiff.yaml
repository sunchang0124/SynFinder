caveats:
  - Diffusion applied to EHR, and in independent benchmarking it preserves code
    prevalence better than the older GAN approaches it replaces.
  - Generates the code profile, not the visit timeline. If inter-visit timing
    matters to your question, this is not the model.
  - Higher fidelity means more of the training distribution is reproduced, so
    the disclosure risk rises with the quality. Run membership inference.
evaluation:
  - Code prevalence and co-occurrence against real data
  - Membership inference, particularly on rare code combinations
