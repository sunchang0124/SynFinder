caveats:
  - Decomposes series into trend and seasonal components inside the diffusion
    process, which makes the output interpretable in a way TimeGAN's is not.
  - Currently among the strongest general time-series generators in published
    benchmarks, and the sensible default to try before TimeGAN.
  - Slow sampling, and long sequences are expensive.
evaluation:
  - Discriminative and predictive scores as used in the time-series literature
  - Autocorrelation structure over the lags that matter clinically
