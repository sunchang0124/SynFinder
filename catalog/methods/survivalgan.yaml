caveats:
  - One of very few methods that treats censoring as part of the problem rather
    than a nuisance. A general tabular generator applied to survival data will
    produce event times and censoring indicators that are jointly incoherent.
  - Optimises for survival-curve agreement, so it can match Kaplan-Meier curves
    while getting the covariate structure less right. Check both.
  - Available through synthcity rather than as a standalone package.
evaluation:
  - Compare Kaplan-Meier curves and the paper's optimism and short-sightedness metrics
  - Fit the same Cox model on real and synthetic data and compare hazard ratios
